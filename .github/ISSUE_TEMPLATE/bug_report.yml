name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: What did you expect instead? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: where
    attributes: { label: Where, description: "Web, API or VS Code extension, and the version or commit" }
  - type: textarea
    id: logs
    attributes: { label: Logs or screenshots, description: "Include the X-Request-Id of a failing API call if you have it. Remove secrets." }
